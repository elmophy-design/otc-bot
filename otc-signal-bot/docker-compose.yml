version: "3.8"

services:
  bot:
    build: .
    container_name: otc-signal-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENV=production
      - DEMO_MODE=${DEMO_MODE:-true}
      - MIN_CONFIDENCE=${MIN_CONFIDENCE:-70}
      - USE_AI=${USE_AI:-false}
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    # Uncomment if you add Redis later
    # depends_on:
    #   - redis

  # Optional Redis cache
