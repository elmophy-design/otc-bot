logging:
  version: 1
  formatters:
    standard:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    console:
      format: "%(asctime)s - %(levelname)s - %(message)s"
      datefmt: "%H:%M:%S"
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: console
      stream: ext://sys.stdout
    file_app:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: standard
      filename: logs/app.log
      maxBytes: 10485760
      backupCount: 5
    file_error:
      class: logging.handlers.RotatingFileHandler
      level: ERROR
      formatter: standard
      filename: logs/error.log
      maxBytes: 10485760
      backupCount: 5
  root:
    level: INFO
    handlers: [console, file_app, file_error]
